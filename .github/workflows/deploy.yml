name: Build and Deploy to Firebase Hosting

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Write environment files
        env:
          ENVIRONMENT_PROD_TS: ${{ secrets.ENVIRONMENT_PROD_TS }}
          ENVIRONMENT_TS: ${{ secrets.ENVIRONMENT_TS }}
        run: |
          mkdir -p src/environments
          printenv ENVIRONMENT_PROD_TS > src/environments/environment.prod.ts
          printenv ENVIRONMENT_TS > src/environments/environment.ts

      - name: Run tests
        run: npm test -- --watch=false --browsers=ChromeHeadlessNoSandbox

      - name: Build
        run: npm run build -- --configuration production

      - name: Setup Node.js for Firebase CLI
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0.7.2
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ijudi-d19bd
          channelId: live
          target: prod
